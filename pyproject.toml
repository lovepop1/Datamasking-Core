[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "datamasking-core"
version = "0.1.0"
description = "Declarative, policy-driven, in-memory data masking and k-anonymity library for JSON, XML, YAML, and CSV."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Adithya Nangarath" },
]
keywords = [
    "data-masking",
    "anonymization",
    "pseudonymization",
    "k-anonymity",
    "privacy",
    "de-identification",
    "jsonpath",
    "xpath",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "lxml>=5.2.0",
    "jsonpath-ng>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "hypothesis>=6.100.0",
    "lxml-stubs>=0.5.1",
    "mypy>=1.11.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
datamasking = "datamasking.cli.main:main"
datamasking-cli = "datamasking.cli.main:main"

[project.urls]
Homepage = "https://github.com/lovepop1/Datamasking-Core"
Repository = "https://github.com/lovepop1/Datamasking-Core"
Documentation = "https://github.com/lovepop1/Datamasking-Core/tree/main/docs"
Issues = "https://github.com/lovepop1/Datamasking-Core/issues"
Changelog = "https://github.com/lovepop1/Datamasking-Core/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/datamasking"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/schema",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["datamasking"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["datamasking"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng", "jsonpath_ng.*"]
ignore_missing_imports = true
